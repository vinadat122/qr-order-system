version: "3.9"

services:
  mysql:
    image: mysql:8

    container_name: qrorder-mysql

    restart: always

    environment:
      MYSQL_ROOT_PASSWORD: 123456

      MYSQL_DATABASE: qrorder

    ports:
      - "3307:3306"

    volumes:
      - mysql_data:/var/lib/mysql

  backend:
    build: ./backend

    container_name: qrorder-backend

    restart: always

    ports:
      - "8080:8080"

    depends_on:
      - mysql

  frontend:
    build: ./frontend

    container_name: qrorder-frontend

    restart: always

    ports:
      - "5173:5173"

    depends_on:
      - backend

volumes:
  mysql_data:
